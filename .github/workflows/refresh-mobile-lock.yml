# One-shot lock regeneration, scoped to this PR branch; self-deletes on success.
name: Aurora one-time Expo npm lock refresh
on:
  push:
    branches: ['fix/aurora-mobile-expo-compat-2026-11-22']
    paths: ['.github/workflows/refresh-mobile-lock.yml']
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'DiogoAbreu01/banco-digital'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/aurora-mobile-expo-compat-2026-11-22
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Re-resolve npm lockfile for Expo SDK constraints
        working-directory: mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install and Expo compatibility
        working-directory: mobile
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx expo install --check
      - name: Commit npm lockfile and remove temporary workflow
        run: |
          rm .github/workflows/refresh-mobile-lock.yml
          git add mobile/package-lock.json .github/workflows/refresh-mobile-lock.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(mobile): resolve SDK-compatible Expo npm lockfile'
          git push origin HEAD:refs/heads/fix/aurora-mobile-expo-compat-2026-11-22
